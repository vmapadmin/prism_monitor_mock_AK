<!DOCTYPE html>
<html lang="en-IN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism Monitor · ValueMap Prism</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#f7f9fb; --line:#e1e6ed; --line2:#eef1f5; --text:#14202f; --muted:#5d6b7c; --faint:#8a96a5;
  --navy:#0c1e38; --navy2:#13294a; --navy-t:#c9d5e6; --navy-accent:#1a3f73;
  --primary:#1f5aa6; --primary-soft:#e8f0fa; --teal:#0e8577; --teal-soft:#e1f3f0; --green:#1e7d47; --green-soft:#e3f3e9;
  --amber:#b26b00; --amber-soft:#fcf1dc; --orange:#c2531a; --orange-soft:#fbe8dc; --red:#b8322a; --red-soft:#fbe6e4; --violet:#5a47a8; --violet-soft:#ece9f8;
  --c-blue:#3b7dd8; --c-slate:#71839a; --c-grey:#a4afbd;
  --paper:#fffefa; --paper-ink:#23262b;
  --r:6px; --r2:10px; --shadow:0 1px 2px rgba(16,32,56,.06),0 2px 8px rgba(16,32,56,.04);
  --font:'Public Sans',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0d131c; --surface:#141c28; --surface2:#18212f; --line:#263244; --line2:#1e2837; --text:#e3e9f1; --muted:#9aa8ba; --faint:#6f7d90;
  --navy:#08111f; --navy2:#0f1c30; --navy-accent:#7fa8e6; --primary:#6ea0e8; --primary-soft:#1a2a42; --teal:#3cbfae; --teal-soft:#10302d; --green:#4fbf7d; --green-soft:#133022;
  --amber:#e5a642; --amber-soft:#35290f; --orange:#e98a55; --orange-soft:#3a2216; --red:#ef7468; --red-soft:#3a1a18; --violet:#a597ea; --violet-soft:#241f3d;
  --c-blue:#6ea0e8; --c-slate:#8b9bb0; --c-grey:#5c6a7c; --paper:#f4f1e8; --shadow:none; } }
:root[data-theme="dark"]{
  --bg:#0d131c; --surface:#141c28; --surface2:#18212f; --line:#263244; --line2:#1e2837; --text:#e3e9f1; --muted:#9aa8ba; --faint:#6f7d90;
  --navy:#08111f; --navy2:#0f1c30; --navy-accent:#7fa8e6; --primary:#6ea0e8; --primary-soft:#1a2a42; --teal:#3cbfae; --teal-soft:#10302d; --green:#4fbf7d; --green-soft:#133022;
  --amber:#e5a642; --amber-soft:#35290f; --orange:#e98a55; --orange-soft:#3a2216; --red:#ef7468; --red-soft:#3a1a18; --violet:#a597ea; --violet-soft:#241f3d;
  --c-blue:#6ea0e8; --c-slate:#8b9bb0; --c-grey:#5c6a7c; --paper:#f4f1e8; --shadow:none; }
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%; margin:0; background:var(--bg); color:var(--text); font:14px/1.45 var(--font); font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.005em}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px} h4{font-size:13.5px; margin:14px 0 6px}
p{margin:6px 0} a{color:var(--primary); text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit; color:inherit} input,select,textarea{font:inherit; color:var(--text)}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
.ic{fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; vertical-align:-3px}
.num{font-variant-numeric:tabular-nums; white-space:nowrap}
.neg{color:var(--red)} .pos{color:var(--teal)} .muted{color:var(--muted)} .fine{font-size:12px} .pad{padding:10px 16px} .nowrap{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ---------- Layout ---------- */
#app{display:grid; grid-template-columns:236px 1fr; height:100%}
#side{background:var(--navy); color:var(--navy-t); display:flex; flex-direction:column; overflow-y:auto; position:relative; z-index:30}
#mainwrap{display:flex; flex-direction:column; min-width:0; height:100%}
#top{display:flex; align-items:center; gap:10px; padding:8px 18px; background:var(--surface); border-bottom:1px solid var(--line); position:relative; z-index:20; flex-wrap:nowrap}
#main{flex:1; overflow-y:auto; padding:20px 24px 48px; min-width:0}
.brand{display:flex; gap:11px; align-items:center; padding:18px 18px 12px}
.prism{width:30px; height:30px; flex:none; clip-path:polygon(50% 0,100% 100%,0 100%); background:linear-gradient(90deg,#e84b5a 0 17%,#f2a03a 17% 34%,#f5d34a 34% 50%,#3fb68b 50% 67%,#3d8be0 67% 84%,#7b5ee0 84%)}
.brand .b1{display:block; font-size:10.5px; letter-spacing:.14em; color:#8fa3bf; font-weight:600}
.brand .b2{display:block; font-size:15px; letter-spacing:.06em; color:#fff; font-weight:700}
.psw{position:relative; padding:0 14px 10px}
.psw>button{width:100%; display:flex; align-items:center; gap:7px; background:var(--navy2); border:1px solid #213a60; color:#dbe5f2; border-radius:var(--r); padding:6px 10px; font-size:12.5px; cursor:pointer}
.psw>button .ic:last-child{margin-left:auto}
.psw-m{position:absolute; left:14px; right:14px; top:36px; background:var(--surface); color:var(--text); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 8px 24px rgba(0,0,0,.18); padding:4px; z-index:5}
.psw-m div{display:flex; justify-content:space-between; align-items:center; padding:7px 9px; font-size:13px; color:var(--muted); border-radius:4px}
.psw-m div.on{color:var(--text); font-weight:600; background:var(--primary-soft)} .psw-m em{font-size:11px; font-style:normal; color:var(--faint)}
#side nav{display:flex; flex-direction:column; padding:4px 8px; gap:1px}
#side nav a{display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:var(--r); color:#b8c6da; font-size:13.5px; text-decoration:none}
#side nav a:hover{background:rgba(255,255,255,.06); color:#fff}
#side nav a.on{background:#1b3a66; color:#fff; box-shadow:inset 3px 0 0 #6ea8f0}
#side nav a em{margin-left:auto; font-style:normal; font-size:11px; background:rgba(255,255,255,.12); color:#fff; padding:0 7px; border-radius:9px; line-height:18px}
.side-foot{margin-top:auto; padding:16px 18px 18px; font-size:12px; display:flex; flex-direction:column; gap:2px; color:#8fa3bf; border-top:1px solid #1c2f4d}
.side-foot b{color:#dbe5f2; font-weight:600} .side-foot .fine{font-size:10.5px; margin-top:6px; line-height:1.35; color:#6f86a6}

.icon-btn{background:none; border:1px solid transparent; border-radius:var(--r); padding:6px; cursor:pointer; color:var(--muted); position:relative; display:inline-flex}
.icon-btn:hover{background:var(--surface2); color:var(--text)} .icon-btn.menu{display:none}
.bell em{position:absolute; top:0; right:-2px; background:var(--red); color:#fff; font-style:normal; font-size:10px; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 4px}
.gsearch{position:relative; flex:1; min-width:180px; max-width:440px; display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--line); border-radius:var(--r); padding:0 10px; color:var(--muted)}
.gsearch input{border:0; background:none; outline:none; padding:7px 0; width:100%; font-size:13px}
.gs-res{position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 10px 30px rgba(0,0,0,.14); max-height:420px; overflow:auto; z-index:40}
.gs-res button{display:grid; grid-template-columns:auto 1fr; gap:2px 8px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line2); padding:8px 10px; cursor:pointer}
.gs-res button:hover{background:var(--primary-soft)} .gs-res .tag{grid-row:span 2; align-self:start} .gs-res .fine{grid-column:2}
.tb-f{display:flex; flex-direction:column; font-size:10.5px; color:var(--faint); gap:1px}
.tb-f select{font-size:12.5px; border:1px solid var(--line); background:var(--surface); border-radius:5px; padding:3px 6px; max-width:190px}
.tb-f.role select{border-color:var(--primary); color:var(--primary); font-weight:600}
.clock{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px}
.me{display:flex; align-items:center; gap:8px; padding-left:6px; border-left:1px solid var(--line)}
.av{width:30px; height:30px; border-radius:50%; background:var(--navy-accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600}
[data-theme="dark"] .av{color:#0d131c}
.me-t{display:flex; flex-direction:column; line-height:1.2} .me-t b{font-size:12.5px} .me-t em{font-size:11px; font-style:normal; color:var(--muted)}
.notif-p{position:absolute; right:18px; top:52px; width:380px; max-width:calc(100vw - 24px); background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); box-shadow:0 14px 40px rgba(0,0,0,.18); z-index:50; max-height:70vh; overflow:auto}
.np-h{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line)}
.np-i{display:flex; flex-direction:column; gap:2px; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line2); padding:10px 14px 10px 18px; cursor:pointer; position:relative; font-size:13px}
.np-i:hover{background:var(--surface2)} .np-i em{font-style:normal; font-size:11px; color:var(--faint)}
.np-i.unread::before{content:""; position:absolute; left:7px; top:15px; width:6px; height:6px; border-radius:50%; background:var(--primary)}
.np-i.unread.k-crit::before{background:var(--red)} .np-i.unread.k-warn::before{background:var(--amber)}
.ro-banner{background:var(--violet-soft); color:var(--violet); border:1px solid color-mix(in srgb,var(--violet) 30%,transparent); padding:8px 12px; border-radius:var(--r); margin-bottom:14px; font-size:13px; display:flex; gap:7px; align-items:center}

/* ---------- Generic ---------- */
.ph{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:16px; flex-wrap:wrap} .ph p{margin:3px 0 0; font-size:13px}
.acts{display:flex; gap:8px; align-items:center; flex-wrap:wrap} .acts+.acts{margin-top:8px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:16px 18px; margin-bottom:16px; box-shadow:var(--shadow); min-width:0}
.card.flush{padding:0} .card.tight{padding:14px} .card.inset{background:var(--surface2); box-shadow:none}
.card>h3{margin-bottom:10px}
.card-h{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line2); flex-wrap:wrap}
.card:not(.flush)>.card-h{padding:0 0 10px; margin-bottom:10px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px} .grid2>.card{margin-bottom:0} .grid2{margin-bottom:16px}
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:7px 13px; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; color:var(--text)}
.btn:hover{border-color:var(--c-grey); background:var(--surface2)} .btn:disabled{opacity:.5; cursor:not-allowed}
.btn.primary{background:var(--primary); border-color:var(--primary); color:#fff} .btn.primary:hover{filter:brightness(1.07)}
[data-theme="dark"] .btn.primary{color:#0d131c}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn.primary{color:#0d131c} }
.btn.danger{color:var(--red); border-color:color-mix(in srgb,var(--red) 45%,transparent)} .btn.danger:hover{background:var(--red-soft)}
.btn.ghost{border-color:transparent; background:none; color:var(--primary)} .btn.ghost:hover{background:var(--primary-soft)}
.btn.sm{padding:4px 9px; font-size:12.5px}
.badge{display:inline-flex; align-items:center; padding:1px 8px; border-radius:10px; font-size:11.5px; font-weight:600; white-space:nowrap; line-height:18px}
.b-grey{background:var(--line2); color:var(--muted)} .b-blue{background:var(--primary-soft); color:var(--primary)} .b-amber{background:var(--amber-soft); color:var(--amber)} .b-orange{background:var(--orange-soft); color:var(--orange)}
.b-red{background:var(--red-soft); color:var(--red)} .b-teal{background:var(--teal-soft); color:var(--teal)} .b-green{background:var(--green-soft); color:var(--green)} .b-violet{background:var(--violet-soft); color:var(--violet)}
.tag{display:inline-block; font-size:11px; padding:0 6px; border-radius:4px; border:1px solid var(--line); color:var(--muted); background:var(--surface2); line-height:17px; white-space:nowrap}
.sev{display:inline-block; width:9px; height:9px; border-radius:50%; flex:none} .sev-critical{background:var(--red)} .sev-high{background:var(--orange)} .sev-medium{background:var(--amber)} .sev-low{background:var(--c-grey)}
.conf{font-size:11.5px; font-weight:600; padding:0 6px; border-radius:4px; line-height:18px} .conf-high{color:var(--green); background:var(--green-soft)} .conf-mod{color:var(--amber); background:var(--amber-soft)} .conf-low{color:var(--red); background:var(--red-soft)}
.sla{font-size:12px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap} .sla-Breached{color:var(--red); font-weight:600} .sla-Warning{color:var(--amber); font-weight:600} .sla-Ontrack,.sla-Met{color:var(--muted)}
.kv{display:grid; grid-template-columns:1fr; gap:0; margin:0} .kv>div{display:grid; grid-template-columns:minmax(140px,40%) 1fr; gap:12px; padding:7px 0; border-bottom:1px solid var(--line2)} .kv>div:last-child{border-bottom:0}
.kv dt{color:var(--muted); font-size:13px} .kv dd{margin:0; font-size:13.5px}
.kv.kv2{grid-template-columns:1fr 1fr; column-gap:28px} .kv.kv4{grid-template-columns:repeat(4,1fr); column-gap:20px}
.kv.kv4>div,.kv.kv2>div{grid-template-columns:1fr; gap:2px} .kv.kv4 dd{font-size:15px; font-weight:600}
.tscroll{overflow-x:auto}
.tbl{width:100%; border-collapse:collapse; font-size:13px}
.tbl th{text-align:left; font-weight:600; font-size:12px; color:var(--muted); padding:8px 12px; border-bottom:1px solid var(--line); background:var(--surface2); white-space:nowrap}
.tbl td{padding:8px 12px; border-bottom:1px solid var(--line2); vertical-align:top}
.tbl .r{text-align:right} .tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--primary-soft)}
.tbl tr.tot td{font-weight:700; border-top:1px solid var(--line); background:var(--surface2)} .tbl tr.inel td{background:color-mix(in srgb,var(--red-soft) 55%,transparent)}
.tbl tr.hi td{background:var(--primary-soft)} .tbl tr.dim td{opacity:.6} .tbl.compact td{padding:7px 10px}
.tbl th.sortable{cursor:pointer} .tbl th.sortable:hover{color:var(--text)}
.card>.tbl:first-child th:first-child{border-top-left-radius:var(--r2)}
.okline{display:flex; gap:8px; align-items:center; color:var(--green); font-size:13.5px; padding:6px 0}
.warnline{display:flex; gap:7px; align-items:flex-start; color:var(--amber); background:var(--amber-soft); padding:7px 10px; border-radius:var(--r); font-size:13px; margin:8px 0}
.why{display:inline-flex; align-items:center; gap:3px; border:0; background:none; color:var(--primary); font-size:11.5px; cursor:pointer; padding:0 2px; font-weight:600}
.why:hover{text-decoration:underline}
.gate{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--violet); background:var(--violet-soft); padding:4px 9px; border-radius:var(--r)}
.empty{text-align:center; padding:36px 16px; color:var(--muted)} .empty .ic{color:var(--faint)} .empty h4{color:var(--text); margin:8px 0 2px; font-size:15px} .empty .btn{margin-top:10px}
.plain{list-style:none; padding:0; margin:0} .plain li{padding:5px 0; font-size:13px; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.lbl{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; font-weight:500}
input[type=text],input:not([type]),input[type=number],select,textarea{width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:7px 9px; font-size:13.5px}
textarea{resize:vertical; line-height:1.45} input[readonly]{background:var(--surface2); color:var(--muted)}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px} .filters select{width:auto; font-size:13px; padding:6px 8px}
.search-in{display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:0 9px; color:var(--muted); min-width:260px; flex:1; max-width:380px}
.search-in input{border:0; padding:7px 0; outline:none; background:none}

/* ---------- Dashboard ---------- */
.kpis{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:16px}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:11px 13px; display:flex; flex-direction:column; gap:1px; box-shadow:var(--shadow)}
.kpi span{font-size:12px; color:var(--muted)} .kpi b{font-size:24px; font-weight:600; letter-spacing:-.01em} .kpi em{font-size:11px; font-style:normal; color:var(--faint)}
.kpi.warn b{color:var(--amber)} .kpi.crit b{color:var(--red)} .kpi.ok b{color:var(--teal)}
.kpi.hero{background:var(--navy); border-color:var(--navy); color:#fff} .kpi.hero span,.kpi.hero em{color:#9fb3cf} .kpi.hero b{color:#fff}
.chart svg{width:100%; height:auto; display:block} .gl{stroke:var(--line2); stroke-width:1} .ax{fill:var(--faint); font-size:11px; font-family:var(--font)} .wf-v{fill:var(--text); font-size:12px; font-weight:600; font-family:var(--font)}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12px; color:var(--muted); margin-top:6px} .legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}
.hbars{display:flex; flex-direction:column; gap:7px} .hbar{display:grid; grid-template-columns:150px 1fr 38px; gap:10px; align-items:center; font-size:13px; cursor:default} .hbar[role=button]{cursor:pointer}
.hl-t{height:10px; background:var(--line2); border-radius:5px; overflow:hidden} .hl-t span{display:block; height:100%; border-radius:5px} .hl-v{text-align:right; font-weight:600}
.funnel{display:flex; flex-direction:column; gap:7px} .fn-row{display:grid; grid-template-columns:130px 1fr 42px; gap:10px; align-items:center; font-size:13px}
.fn-t{height:24px; background:var(--line2); border-radius:4px; overflow:hidden} .fn-t span{display:flex; align-items:center; height:100%; background:var(--navy-accent); padding-left:8px; color:#fff; font-size:12px; border-radius:4px; min-width:36px}
[data-theme="dark"] .fn-t span{color:#0d131c}
.fn-c{text-align:right; font-size:12px}
.risk-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px} .rk{border:1px solid var(--line2); border-radius:var(--r); padding:9px 11px; background:var(--surface2)}
.rk-h{display:flex; gap:9px; align-items:baseline} .rk-h b{font-size:19px} .rk-h span{font-size:12.5px; color:var(--muted)} .rk-l{display:flex; gap:10px; flex-wrap:wrap; font-size:12px; margin-top:3px}
.diff{background:var(--surface); border:1px solid var(--line); border-radius:var(--r2); padding:16px 18px; position:relative; overflow:hidden}
.diff::before{content:""; position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg,#e84b5a,#f2a03a,#f5d34a,#3fb68b,#3d8be0,#7b5ee0)}
.diff h3{margin-bottom:12px} .diff-row{display:flex; align-items:stretch; gap:8px; flex-wrap:wrap}
.diff-row>div{flex:1 1 150px; display:flex; flex-direction:column; gap:3px; padding:10px 12px; background:var(--surface2); border-radius:var(--r)} .diff-row b{font-size:13.5px} .diff-row span{font-size:12px; color:var(--muted)}
.diff-row>i{align-self:center; font-style:normal; color:var(--faint); font-size:18px}

/* ---------- Case header ---------- */
.crumbs{display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--muted); margin-bottom:6px} .crumbs .ic{color:var(--faint)}
.case-head{position:sticky; top:-20px; z-index:10; background:var(--bg); padding:0 0 10px; margin:-20px -24px 0; padding:14px 24px 10px; border-bottom:1px solid var(--line)}
.ch-top{display:flex; justify-content:space-between; gap:16px; align-items:flex-start; flex-wrap:wrap}
.ch-name{font-size:22px} .ch-name a{color:var(--text)}
.ch-meta{display:flex; gap:6px 14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:3px}
.ch-status{display:flex; flex-direction:column; align-items:flex-end; gap:5px}

let ST;
function buildCase(s){
  const bor = B(s.b);
  const types = s.pageTypes || PAGES8;
  const pages = types.map((type, i) => ({
    n: i + 1, type, conf: s.pageConf?.[i] ?? 95,
    sigReq: SIG_REQ.includes(type), signed: !(s.unsigned || []).includes(i + 1),
    stampReq: STAMP_REQ.includes(type), stamped: !(s.nostamp || []).includes(i + 1),
    span: (type.startsWith('Annexure – Invoice') && s.annexSpan) ? s.annexSpan : null,
    skew: s.scanned ? [-1.6, 1.1, -0.8, 2.2, -1.2, 1.8, -0.6, 2.8][i] : 0,
  }));
  const pageOf = t => (pages.find(p => p.type === t) || pages[0]).n;
  const stockRep = sum(s.stock.map(r => r.rep));
  const debtSum = sum(s.debtors.map(d => d.amt));
  const credSum = sum(s.creditors.map(c => c.amt));
  const custDed = sum(s.creditors.filter(c => c.stock && c.custDed).map(c => c.amt));
  const stockTotalRep = s.stockTotal ? L(s.stockTotal * 100) : stockRep;
  const fields = [
    { key:'stmtDate', name:'Statement date', page:1, region:'title', type:'text', extracted:'31-Aug-2026', conf:99 },
    { key:'stockTotal', name:'Total stock (summary)', page:1, region:'total', type:'amt', extracted:stockTotalRep, truth:stockTotalRep, conf:98 },
    { key:'debtorTotal', name:'Total book debts', page:pageOf('Debtor Ageing Summary'), region:'total', type:'amt', extracted:debtSum, truth:debtSum, conf:97 },
    { key:'credTotal', name:'Total creditors', page:pageOf('Creditor Details'), region:'total', type:'amt', extracted:credSum, truth:credSum, conf:97 },
    { key:'sanction', name:'Sanctioned limit (as stated)', page:pageOf('Bank Limits & DP Working'), region:'sanction', type:'amt', extracted:L(s.sanction * 100), conf:99 },
    { key:'outstanding', name:'Outstanding (as stated)', page:pageOf('Bank Limits & DP Working'), region:'outstanding', type:'amt', extracted:L(s.outstanding * 100), truth:L(s.outstanding * 100), conf:98 },
  ];
  if (types.includes('Declaration')) fields.push({ key:'declaration', name:'Declaration clause', page:pageOf('Declaration'), region:'declaration', type:'text', extracted:'Present – signed by authorised signatory', conf:96 });
  fields.forEach(f => { Object.assign(f, (s.fieldOv || {})[f.key] || {}); f.reviewed = false; f.validated = null; f.id = s.id + '-' + f.key; });

    id: s.id, bId: s.b, bor, scenario: s.scenario, month: 'Aug 2026', version: s.version || 1, priorVersion: s.priorVersion || null,

/* ================= Credit Rule Engine (deterministic) ================= */
const CreditRuleEngine = {
  validateStock(c, sim = {}){
    const cam = c.cam;
    const rows = c.stock.map(r => {
      const recalc = r.sub ? sum(r.sub.map(x => x.amt)) : r.rep;
      let elig = r.cat === 'Goods in Transit' ? (cam.gitEligible || !!c.ovr.GIT) : cam.eligibleCats.includes(r.cat);
      const reason = elig ? 'Eligible category (' + CLAUSE.elig + ')' : r.cat === 'Goods in Transit' ? 'Goods in transit not eligible (' + CLAUSE.git + ')' : 'Category not eligible under CAM';
      return { ...r, recalc, elig, eligAmt: elig ? recalc : 0, reason };
    });
    return rows;
  },
  validateReceivables(c, sim = {}){
    const cam = c.cam;
    let realise = sim.realise || 0;
    return c.debtors.map(d => {
      const effAge = d.acceptedAge ?? d.age;
      let elig = true, reason = 'Within ' + cam.recAge + ' days';
      if (d.related && cam.excludeRelated && !c.ovr.RELATED){ elig = false; reason = 'Related-party receivable (' + CLAUSE.related + ')'; }
      else if (effAge > cam.recAge && !c.ovr.OVERAGED){ elig = false; reason = 'Aged ' + effAge + ' days > ' + cam.recAge + ' (' + CLAUSE.age + ')'; }
      if (d.acceptedAge != null && elig) reason = 'Re-aged to ' + effAge + ' days from GRN acceptance (RM evidence accepted)';
      let eligAmt = elig ? d.amt : 0, simAdd = 0;
      if (!elig && !d.related && realise > 0){ simAdd = Math.min(realise, d.amt); realise -= simAdd; }
      return { ...d, effAge, elig, reason, eligAmt, simAdd, bucket: effAge <= 30 ? '0–30' : effAge <= 60 ? '31–60' : effAge <= 90 ? '61–90' : effAge <= 120 ? '91–120' : '>120' };
    });
  },
  validateCreditors(c, sim = {}){
    const pctDed = sim.credPct ?? 100;
    return c.creditors.map(x => {
      const ded = c.cam.deductCreditors && x.stock && !c.ovr.CRED ? Math.round(x.amt * pctDed / 100) : 0;
      return { ...x, ded, status: x.stock ? (x.custDed ? 'Deducted by customer' : 'Not deducted by customer') : 'Not stock-related' };
    });
  },
  applyMargins(base, pctM){ const m = Math.round(base * pctM / 100); return { margin: m, net: base - m }; },
  applySanctionCap(dp, sanction){ return Math.min(dp, sanction); },
  calculateDP(c, sim = {}){
    const rows = this.validateStock(c, sim);
    const grossStock = sum(rows.map(r => r.recalc)) + (sim.stockAdj || 0);
    const ineligibleStock = sum(rows.filter(r => !r.elig).map(r => r.recalc));
    const eligibleStock = grossStock - ineligibleStock;
    const creds = this.validateCreditors(c, sim);
    const creditors = sum(creds.map(x => x.ded));
    const netStock = Math.max(0, eligibleStock - creditors);
    const sm = sim.stockMargin ?? c.cam.stockMargin, rmP = sim.recMargin ?? c.cam.recMargin;
    const sM = this.applyMargins(netStock, sm);
    const debts = this.validateReceivables(c, sim);
    const grossRec = sum(debts.map(d => d.amt));
    const overaged = sum(debts.filter(d => !d.elig && !d.related).map(d => d.amt));
    const related = sum(debts.filter(d => !d.elig && d.related).map(d => d.amt));
    const simAdd = sum(debts.map(d => d.simAdd));
    const eligibleRec = grossRec - overaged - related + simAdd;
    const rM = this.applyMargins(eligibleRec, rmP);
    const calculatedDP = sM.net + rM.net;
    const recommended = this.applySanctionCap(calculatedDP, c.sanction);
    return { rows, grossStock, ineligibleStock, eligibleStock, creds, creditors, netStock, stockMarginPct: sm, stockMarginAmt: sM.margin, stockDP: sM.net,
      debts, grossRec, overaged, related, simAdd, eligibleRec, recMarginPct: rmP, recMarginAmt: rM.margin, recDP: rM.net,
      calculatedDP, sanction: c.sanction, recommended, capped: calculatedDP > c.sanction, existing: c.operative, change: recommended - c.operative,
      outstanding: c.cbsOutstanding, shortfall: Math.max(0, c.cbsOutstanding - recommended) };
  },
  arithmeticChecks(c){
    const tol = ST.cfg.arithTol, out = [];
    const rows = c.stock.map(r => ({ ...r, recalc: r.sub ? sum(r.sub.map(x => x.amt)) : r.rep }));
    rows.filter(r => r.sub).forEach(r => out.push({ id: 'AR-ROW-' + r.cat.slice(0, 3).toUpperCase(), group: 'Stock', rule: 'Sub-schedule carried to summary', desc: r.cat + ': Inventory Details (page 2) → Stock Summary (page 1)', page: 2, reported: r.rep, system: r.recalc, lines: r.sub }));
    const stPend = isPending(c, 'stockTotal');
    out.push({ id: 'AR-STK-TOT', group: 'Stock', rule: 'Grand total', desc: 'Stock Summary total vs sum of system-recalculated line items', page: 1, reported: fieldVal(c, 'stockTotal'), system: sum(rows.map(r => r.recalc)), pending: stPend, key: 'stockTotal' });
    out.push({ id: 'AR-STK-COL', group: 'Stock', rule: 'Column footing', desc: 'Stock Summary total vs sum of customer-reported line items', page: 1, reported: fieldVal(c, 'stockTotal'), system: sum(rows.map(r => r.rep)), pending: stPend, key: 'stockTotal' });
    const dSum = sum(c.debtors.map(d => d.amt));
    out.push({ id: 'AR-DEB-TOT', group: 'Debtors', rule: 'Schedule total', desc: 'Debtor Ageing Summary total vs invoice-level schedule', page: c.fields.find(f => f.key === 'debtorTotal').page, reported: fieldVal(c, 'debtorTotal'), system: dSum, pending: isPending(c, 'debtorTotal'), key: 'debtorTotal' });
    out.push({ id: 'AR-DEB-BKT', group: 'Debtors', rule: 'Ageing buckets', desc: 'Sum of ageing buckets vs schedule total', page: c.fields.find(f => f.key === 'debtorTotal').page, reported: dSum, system: dSum });
    out.push({ id: 'AR-CRD-TOT', group: 'Creditors', rule: 'Schedule total', desc: 'Creditor Details total vs line items', page: c.fields.find(f => f.key === 'credTotal').page, reported: fieldVal(c, 'credTotal'), system: sum(c.creditors.map(x => x.amt)), pending: isPending(c, 'credTotal'), key: 'credTotal' });
    out.forEach(o => { o.diff = (o.reported ?? 0) - o.system; o.status = o.pending ? 'PENDING' : Math.abs(o.diff) > tol ? 'MISMATCH' : 'PASS'; });
    return out;
  },
  evaluateExceptions(c){
    const k = this.calculateDP(c), ar = this.arithmeticChecks(c), res = [];
    const di = DocumentIntelligenceService;
    const stockTot = ar.find(a => a.id === 'AR-STK-TOT');
    if (stockTot.status === 'MISMATCH') res.push({ key: 'ARITH_STOCK', cat: 'Arithmetic', sev: Math.abs(stockTot.diff) > L(10) ? 'High' : 'Medium', rmReq: false, page: 1 });
    if (ar.find(a => a.id === 'AR-DEB-TOT').status === 'MISMATCH') res.push({ key: 'ARITH_DEBT', cat: 'Data Inconsistency', sev: 'Medium', rmReq: false, page: c.fields.find(f => f.key === 'debtorTotal').page });
    if (ar.find(a => a.id === 'AR-CRD-TOT').status === 'MISMATCH') res.push({ key: 'ARITH_CRED', cat: 'Arithmetic', sev: 'Medium', rmReq: false, page: c.fields.find(f => f.key === 'credTotal').page });
    if (c.stock.some(r => r.cat === 'Goods in Transit' && r.rep > 0) && !c.cam.gitEligible) res.push({ key: 'GIT', cat: 'Stock Eligibility', sev: 'Medium', rmReq: false, page: 1 });
    if (c.debtors.some(d => !d.related && d.age > c.cam.recAge)) res.push({ key: 'OVERAGED', cat: 'Debtor Eligibility', sev: 'High', rmReq: true, page: c.fields.find(f => f.key === 'debtorTotal').page });
    if (c.debtors.some(d => d.related) && c.cam.excludeRelated) res.push({ key: 'RELATED', cat: 'Debtor Eligibility', sev: 'Medium', rmReq: false, page: c.fields.find(f => f.key === 'debtorTotal').page });
    if (c.creditors.some(x => x.stock && !x.custDed)) res.push({ key: 'CRED_SHORT', cat: 'Creditor Treatment', sev: 'High', rmReq: true, page: c.fields.find(f => f.key === 'credTotal').page });
    if (c.custSM !== c.cam.stockMargin || c.custRM !== c.cam.recMargin) res.push({ key: 'MARGIN', cat: 'CAM/DN Compliance', sev: 'High', rmReq: false, page: c.fields.find(f => f.key === 'sanction').page });
    const sig = di.detectSignature(c); if (sig.status === 'FAIL') res.push({ key: 'SIGNATURE', cat: 'Signature/Stamp', sev: 'Critical', rmReq: true, page: sig.missing[0] });

/* ================= Case status (derived, never stored) ================= */
function caseStatus(c){
  if (!c.received) return 'Not Received';
  if (c.processing) return 'Processing';
  if (c.limit?.status === 'SUCCESS') return 'Completed';
  if (c.limit && ['FAILED', 'MANUAL'].includes(c.limit.status)) return 'Limit Update Failed';
  if (c.approval?.decision === 'Approved') return 'Limit Update Pending';
  if (c.submission && !c.returned) return 'Awaiting Approval';
  if (pendingFields(c).length) return 'Validation Review';
  if (c.excs.some(e => e.status === 'Sent to RM')) return 'Awaiting RM';
  if (c.excs.some(e => e.status === 'RM Responded')) return 'RM Responded';
  if (c.excs.some(e => e.status === 'Open')) return c.returned ? 'Credit Review' : 'Exception Review';
  if (c.returned) return 'Credit Review';

}
const STAGES = ['Received', 'Validation', 'Exceptions', 'RM clarification', 'Drawing power', 'Approval', 'Limit update', 'Closed'];

  const st = caseStatus(c);

  if (['Completed'].includes(st)) return { s: 'Met', t: 'Closed' };
  const rmEx = c.excs.filter(e => e.status === 'Sent to RM');
  if (rmEx.length){ const due = Math.min(...rmEx.map(e => e.dueAt)); const left = due - SIM_NOW; return left < 0 ? { s: 'Breached', t: 'RM SLA breached by ' + dur(-left) } : { s: left < ST.cfg.sla.reminder * HR ? 'Warning' : 'On track', t: 'RM due in ' + hm(left) }; }

  if (['Awaiting Approval', 'Limit Update Pending', 'Limit Update Failed'].includes(st)) return { s: 'On track', t: 'With ' + (st === 'Awaiting Approval' ? 'checker' : 'operations') };

/* ---------- Charts ---------- */
function lineChart({ labels, series, h = 230, fmt = v => cr(v), zero = false, compact = false }){
  const W = 640, H = h, pl = 64, pr = 14, pt = 12, pb = 26;
  const all = series.flatMap(s => s.values).filter(v => v != null);
  let mn = Math.min(...all), mx = Math.max(...all); if (zero) mn = 0;
  const pad = (mx - mn) * 0.12 || Math.abs(mx) * 0.1 || 1; mx += pad; if (!zero) mn -= pad;
  const x = i => pl + (W - pl - pr) * (labels.length === 1 ? 0.5 : i / (labels.length - 1));
  const y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
  let g = '';
  for (let i = 0; i <= 4; i++){ const v = mn + (mx - mn) * i / 4, yy = y(v); g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" class="gl"/><text x="${pl - 8}" y="${yy + 4}" class="ax" text-anchor="end">${esc(fmt(v))}</text>`; }
  labels.forEach((l, i) => { if (labels.length <= 12 || i % 2 === 0) g += `<text x="${x(i)}" y="${H - 7}" class="ax" text-anchor="middle">${esc(l)}</text>`; });
  const paths = series.map(s => {
    const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const dots = s.values.map((v, i) => v == null ? '' : `<circle cx="${x(i)}" cy="${y(v)}" r="${compact ? 2 : 3}" style="fill:var(--surface);stroke:${s.color};stroke-width:2"><title>${esc(s.name + ' · ' + labels[i] + ': ' + fmt(v))}</title></circle>`).join('');
    return `<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:${s.w || 2};${s.dash ? 'stroke-dasharray:5 4' : ''}"/>${dots}`;
  }).join('');
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="xMidYMid meet">${g}${paths}</svg>${legend}</div>`;
}
function hBars(items, { fmt = v => v, color = 'var(--primary)', max } = {}){
  const m = max ?? Math.max(...items.map(i => i.v));
  return `<div class="hbars">${items.map(i => `<div class="hbar" ${i.onclick ? `onclick="${i.onclick}" role="button" tabindex="0"` : ''}><span class="hl-l">${esc(i.l)}</span><span class="hl-t"><span style="width:${Math.max(2, i.v / m * 100)}%;background:${i.c || color}"></span></span><span class="hl-v num">${fmt(i.v)}</span></div>`).join('')}</div>`;
}
function funnel(items){
  const m = items[0].v;
  return `<div class="funnel">${items.map((i, idx) => { const conv = idx ? Math.round(i.v / items[idx - 1].v * 100) : 100;
    return `<div class="fn-row"><span class="fn-l">${esc(i.l)}</span><span class="fn-t"><span style="width:${i.v / m * 100}%"><b class="num">${i.v}</b></span></span><span class="fn-c muted num">${idx ? conv + '%' : ''}</span></div>`; }).join('')}</div>`;
}
function waterfall(steps){
  const W = 760, H = 270, pl = 8, pr = 8, pt = 26, pb = 58, n = steps.length, bw = (W - pl - pr) / n;
  let run = 0; const bars = [];
  steps.forEach(s => { if (s.t === 'total'){ bars.push({ ...s, a: 0, b: s.v }); run = s.v; } else if (s.t === 'minus'){ bars.push({ ...s, a: run - s.v, b: run }); run -= s.v; } else if (s.t === 'plus'){ bars.push({ ...s, a: run, b: run + s.v }); run += s.v; } else if (s.t === 'start'){ bars.push({ ...s, a: 0, b: s.v }); run = s.v; } });
  const mx = Math.max(...bars.map(b => b.b)) * 1.08; const y = v => pt + (H - pt - pb) * (1 - v / mx);
  let out = `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" class="gl"/>`;
  bars.forEach((b, i) => {
    const x = pl + i * bw + bw * 0.14, w = bw * 0.72;
    const col = b.t === 'minus' ? 'var(--red)' : b.t === 'plus' ? 'var(--teal)' : b.hi ? 'var(--navy-accent)' : 'var(--primary)';
    out += `<rect x="${x}" y="${y(b.b)}" width="${w}" height="${Math.max(1, y(b.a) - y(b.b))}" rx="2" style="fill:${col};opacity:${b.t === 'minus' ? 0.85 : 1}"><title>${esc(b.l + ': ' + cr(b.v))}</title></rect>`;
    out += `<text x="${x + w / 2}" y="${y(b.b) - 7}" class="wf-v" text-anchor="middle">${b.t === 'minus' ? '−' : ''}${esc(trimDec(b.v / 1e7))}</text>`;
    const words = b.l.split(' '); let line = '', lines = []; words.forEach(wd => { if ((line + ' ' + wd).trim().length > 12){ lines.push(line.trim()); line = wd; } else line += ' ' + wd; }); lines.push(line.trim());
    lines.slice(0, 3).forEach((ln, j) => out += `<text x="${x + w / 2}" y="${H - pb + 16 + j * 12}" class="ax" text-anchor="middle">${esc(ln)}</text>`);
    if (i < bars.length - 1 && steps[i + 1].t !== 'total' && steps[i + 1].t !== 'start'){ const nb = bars[i + 1]; const lvl = b.t === 'minus' ? b.a : b.b; out += `<line x1="${x + w}" x2="${x + bw}" y1="${y(lvl)}" y2="${y(lvl)}" style="stroke:var(--muted);stroke-dasharray:2 2"/>`; }
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Drawing power waterfall, values in ₹ crore">${out}</svg><div class="legend"><span><i style="background:var(--primary)"></i>Totals (₹ Cr)</span><span><i style="background:var(--red)"></i>Deductions</span><span><i style="background:var(--navy-accent)"></i>Drawing power</span></div></div>`;
}
function spark(vals, color = 'var(--primary)'){
  const W = 90, H = 26, mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const d = vals.map((v, i) => (i ? 'L' : 'M') + (i * W / (vals.length - 1)).toFixed(1) + ' ' + (H - 3 - (v - mn) / r * (H - 6)).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><path d="${d}" style="fill:none;stroke:${color};stroke-width:1.6"/></svg>`;
}

/* ---------- Overview ---------- */
function tOverview(c){
  if (!c.received) return `<div class="grid2"><div class="card"><h3>Statement status</h3>${kv([['Statement month', c.month], ['Due date', fmtD(c.dueDate)], ['Status', badge('Not Received')], ['Overdue by', dur(SIM_NOW - c.dueDate)], ['Expected from', esc(c.from)]])}
    <p class="muted" style="margin-top:12px">Upload the statement when it arrives. Prism will classify pages, extract data, recalculate totals and compare against CAM/DN terms automatically.</p>
    <button class="btn primary" onclick="A.upload('${c.bId}')">${icon('upload')} Upload stock statement</button></div>${tCam(c, true)}</div>`;
  const k = CRE.calculateDP(c), di = DocumentIntelligenceService.analyseDocument(c), ar = CRE.arithmeticChecks(c);
  const oe = openExcs(c).sort((a, b) => ['Critical', 'High', 'Medium', 'Low'].indexOf(a.sev) - ['Critical', 'High', 'Medium', 'Low'].indexOf(b.sev));
  const pend = pendingFields(c), cmp = compareRows(c), fails = cmp.filter(r => r.res === 'FAIL').length;
  const attention = [
    ...pend.map(f => `<li><span class="al-i amber">${icon('eye', 14)}</span><div><b>${esc(f.name)}</b> extracted at ${f.conf}% confidence<div class="muted">Page ${f.page} · needs human validation</div></div><button class="btn sm" onclick="A.tab('docs')">Validate</button></li>`),
    ...oe.map(e => { const v = exView(c, e); return `<li><span class="al-i">${sevDot(e.sev)}</span><div><b>${esc(e.title)}</b><div class="muted">${e.id} · ${e.status}${v.impact ? ' · DP impact ' + amt(v.impact) : ''}</div></div><button class="btn sm" onclick="A.openEx('${e.id}')">Open</button></li>`; }),
  ];
  const chk = di.checks.filter(x => x.status !== 'PASS').length;
  return `<div class="ov-grid">
    <section class="card"><h3>What needs attention</h3>${attention.length ? `<ul class="attn">${attention.join('')}</ul>` : `<div class="okline">${icon('checkc')} Nothing outstanding on this case.</div>`}</section>
    <section class="card dp-card">
      <h3>Drawing power impact</h3>
      <div class="dp-flow"><div><span>Existing operative limit</span><b class="num">${cr(c.operative)}</b></div><div class="arrow">${icon('chev', 20)}</div><div><span>Recommended operative limit</span><b class="num big">${cr(k.recommended)}</b></div></div>
      <div class="dp-delta ${k.change < 0 ? 'neg' : 'pos'}">${k.change < 0 ? 'Reduction of ' : 'Increase of '}${cr(Math.abs(k.change))} ${whyBtn('limit:' + c.id, 'Why?')}</div>
      ${k.shortfall ? `<div class="warnline">${icon('alert', 14)} Outstanding ${cr(c.cbsOutstanding)} exceeds recommended DP by ${lk(k.shortfall)} — irregularity to be regularised.</div>` : ''}
      <button class="btn" onclick="A.tab('dp')">Open DP calculation</button>
    </section>
    <section class="card"><h3>What the system found</h3>
      <div class="found">
        <div onclick="A.tab('docs')"><b class="num">${c.pages.length}${c.pages.some(p => p.span) ? '+' : ''}</b><span>page groups classified</span></div>
        <div onclick="A.tab('docs')"><b class="num">${di.overall}%</b><span>extraction confidence</span></div>
        <div onclick="A.tab('docs')"><b class="num ${chk ? 'neg' : ''}">${di.checks.length - chk}/${di.checks.length}</b><span>document checks passed</span></div>
        <div onclick="A.tab('arith')"><b class="num ${ar.some(a => a.status === 'MISMATCH') ? 'neg' : ''}">${ar.filter(a => a.status === 'MISMATCH').length}</b><span>arithmetic mismatches</span></div>
        <div onclick="A.tab('compare')"><b class="num ${fails ? 'neg' : ''}">${fails}</b><span>CAM/DN variances</span></div>
        <div onclick="A.tab('exceptions')"><b class="num">${c.excs.length}</b><span>exceptions raised</span></div>
      </div>
      <p class="fine muted">Extraction by ${DocumentIntelligenceService.provider}. Every figure feeding DP is recalculated by the deterministic credit rule engine.</p>
    </section>
    <section class="card"><h3>Borrower signals</h3>${ewsCards(c, true)}</section>
  </div>`;
}

/* ---------- Document intelligence ---------- */
function tDocs(c){
  const di = DocumentIntelligenceService.analyseDocument(c), cur = ST.ui.page || 1, p = c.pages.find(x => x.n === cur) || c.pages[0];
  const thr = ST.cfg.reviewThreshold;
  return `<div class="doc-ws">
    <div class="thumbs">${c.pages.map(pg => `<button class="thumb ${pg.n === p.n ? 'on' : ''}" onclick="A.page(${pg.n})"><div class="th-mini ${pg.conf < thr ? 'low' : ''}">${miniLines(pg)}</div><div class="th-l"><b>${pg.span ? pg.span[0] + '–' + pg.span[1] : 'P' + pg.n}</b> ${esc(pg.type)}</div>${confPill(pg.conf)}${pg.conf < thr ? '<span class="rr">Review</span>' : ''}</button>`).join('')}</div>
    <div class="viewer"><div class="v-bar"><span>Page ${p.span ? p.span[0] + '–' + p.span[1] : p.n} of ${c.pages.some(x => x.span) ? c.pages[c.pages.length - 1].span[1] : c.pages.length} · <b>${esc(p.type)}</b> · classified at ${p.conf}%</span><span class="muted">${esc(c.from)} · v${c.version}${c.scanned ? ' · scanned, skew corrected for extraction' : ''}</span></div>
      <div class="v-stage">${renderPage(c, p)}</div></div>
    <aside class="doc-side">
      <div class="card tight"><h3>Document validation</h3>
        <ul class="vlist">${di.checks.map(x => `<li><button onclick="A.hl(${x.page},'${x.region}')" class="${ST.ui.hl && ST.ui.hl.region === x.region && ST.ui.hl.page === x.page ? 'on' : ''}"><span>${esc(x.label)}</span>${badge(x.status)}</button><div class="muted fine">${esc(x.detail)}</div></li>`).join('')}</ul>
        <div class="dq"><div><span>Document quality</span><b class="num">${di.quality}%</b></div><div><span>Overall confidence</span><b class="num">${di.overall}%</b></div></div>
      </div>
      <div class="card tight"><h3>Extracted key fields</h3><p class="fine muted">Below ${thr}% needs validation. Confidence applies to extraction only, never to calculations.</p>
        <ul class="fields">${c.fields.map(f => fieldRow(c, f)).join('')}</ul></div>
    </aside>
  </div>`;
}
function fieldRow(c, f){
  const pend = fieldPending(f), v = f.reviewed ? f.validated : f.extracted, show = x => f.type === 'amt' ? inr(x) : esc(x);
  const act = pend && can('analyst') ? `<div class="f-act"><button class="btn sm" onclick="A.acceptField('${c.id}','${f.key}')">Accept</button><button class="btn sm" onclick="A.editField('${c.id}','${f.key}')">Edit</button><button class="btn sm ghost" onclick="A.hl(${f.page},'${f.region}')">View source</button></div>`
    : pend ? `<div class="f-act">${roleGate('analyst', 'Validation by Credit Analyst')}</div>` : `<div class="f-act"><button class="btn sm ghost" onclick="A.hl(${f.page},'${f.region}')">View source</button></div>`;
  return `<li class="${pend ? 'pend' : ''}"><div class="f-top"><span>${esc(f.name)}</span>${confPill(f.conf)}</div><div class="f-val num">${show(v)}</div>
    <div class="fine muted">Page ${f.page} · ${f.reviewed ? (f.validated !== f.extracted ? 'Corrected by ' + esc(f.by) + ' (was ' + show(f.extracted) + ')' : 'Accepted by ' + esc(f.by)) : pend ? 'Pending validation' : 'Auto-accepted'}</div>${act}</li>`;
}
function miniLines(p){ return '<i></i><i></i><i class="s"></i><i></i><i class="s"></i><i></i>'; }

function renderPage(c, p){
  const hl = ST.ui.hl, h = r => (hl && hl.page === p.n && hl.region === r) ? ' hl-on' : '';
  const b = c.bor, fOf = k => c.fields.find(f => f.key === k), low = k => { const f = fOf(k); return f && f.conf < ST.cfg.reviewThreshold ? ' smudge' : ''; };
  const num = v => (v / 1).toLocaleString('en-IN');
  const T = (rows, cols) => `<table class="pt"><thead><tr>${cols.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`;
  let body = '';
  const invDate = d => fmtD(STMT_DATE - d.age * DAY);
  const buckets = () => { const bk = { '0–30': 0, '31–60': 0, '61–90': 0, '91–120': 0, '>120': 0 }; c.debtors.forEach(d => { const a = d.age; bk[a <= 30 ? '0–30' : a <= 60 ? '31–60' : a <= 90 ? '61–90' : a <= 120 ? '91–120' : '>120'] += d.amt; }); return bk; };
  switch (true){
    case p.type === 'Stock Summary':
      body = `<div class="pr${h('table')}" data-r="table">${T(c.stock.map((r, i) => `<tr><td>${i + 1}</td><td>${r.cat}</td><td class="r">${num(r.rep)}</td></tr>`).join(''), ['#', 'Particulars', 'Amount (₹)'])}</div>
        <div class="pr ptot${h('total')}${low('stockTotal')}" data-r="total"><span>Total stock</span><span>${num(fOf('stockTotal').truth)}</span></div>
        <p class="pnote">Stocks valued at lower of cost or net realisable value. Detailed schedules annexed.</p>`; break;
    case p.type === 'Inventory Details':
      body = c.stock.map(r => r.sub ? `<div class="psub"><b>${r.cat}</b>${T(r.sub.map(s => `<tr><td>${s.name}</td><td class="r">${num(s.amt)}</td></tr>`).join('') + `<tr class="st"><td>Sub-total carried to summary</td><td class="r">${num(r.rep)}</td></tr>`, ['Item', '₹'])}</div>` : `<div class="psub"><b>${r.cat}</b><div class="pl"><span>As per stock register</span><span>${num(r.rep)}</span></div></div>`).join(''); break;
    case p.type === 'Debtor Ageing Schedule':
      body = `<div class="pr${h('table')}" data-r="table">${T(c.debtors.map(d => `<tr><td>${esc(d.name)}</td><td>${d.inv}</td><td>${invDate(d)}</td><td class="r">${num(d.amt)}</td><td class="r">${d.age}</td></tr>`).join(''), ['Debtor', 'Invoice', 'Date', '₹', 'Days'])}</div>`; break;
    case p.type === 'Debtor Ageing Summary': {
      const bk = buckets(), hasSched = c.pages.some(x => x.type === 'Debtor Ageing Schedule');
      body = (hasSched ? '' : `<div class="pr" data-r="table">${T(c.debtors.map(d => `<tr><td>${esc(d.name)}</td><td>${d.inv}</td><td class="r">${num(d.amt)}</td><td class="r">${d.age}</td></tr>`).join(''), ['Debtor', 'Invoice', '₹', 'Days'])}</div>`)
        + T(Object.entries(bk).map(([k2, v]) => `<tr><td>${k2} days</td><td class="r">${num(v)}</td></tr>`).join(''), ['Ageing bucket', 'Amount (₹)'])
        + `<div class="pr ptot${h('total')}${low('debtorTotal')}" data-r="total"><span>Total book debts</span><span>${num(fOf('debtorTotal').truth)}</span></div>`; break; }
    case p.type === 'Creditor Details':
      body = `<div class="pr${h('table')}" data-r="table">${T(c.creditors.map(x => `<tr><td>${esc(x.name)}</td><td>${x.stock ? 'Trade – stock' : 'Non-trade'}</td><td class="r">${num(x.amt)}</td><td>${x.custDed ? 'Yes' : 'No'}</td></tr>`).join(''), ['Creditor', 'Nature', '₹', 'In DP working'])}</div>
        <div class="pr ptot${h('total')}${low('credTotal')}" data-r="total"><span>Total creditors</span><span>${num(fOf('credTotal').truth ?? fOf('credTotal').extracted)}</span></div>`; break;
    case p.type === 'Bank Limits & DP Working': {
      const cs = fOf('stockTotal').truth, cd = fOf('debtorTotal').truth, sdp = Math.round((cs - c.custDed) * (100 - c.custSM) / 100), rdp = Math.round(cd * (100 - c.custRM) / 100);
      body = `${T(`<tr><td>Our bank</td><td>${c.cam.facility}</td><td class="r pr${h('sanction')}" data-r="sanction">${num(c.sanction)}</td><td class="r pr${h('outstanding')}${low('outstanding')}" data-r="outstanding">${num(fOf('outstanding').truth ?? fOf('outstanding').extracted)}</td></tr>`, ['Bank', 'Facility', 'Sanction (₹)', 'Outstanding (₹)'])}
        <div class="psub"><b>Drawing power working (by borrower)</b>
        <div class="pl"><span>Total stock</span><span>${num(cs)}</span></div><div class="pl"><span>Less: creditors</span><span>${num(c.custDed)}</span></div>
        <div class="pl"><span>Less: margin @ ${c.custSM}%</span><span>${num(Math.round((cs - c.custDed) * c.custSM / 100))}</span></div><div class="pl"><span>Book debts less margin @ ${c.custRM}%</span><span>${num(rdp)}</span></div>
        <div class="pl b"><span>Drawing power claimed</span><span>${num(sdp + rdp)}</span></div></div>`; break; }
    case p.type === 'Declaration':
      body = `<div class="pr pdecl${h('declaration')}${low('declaration')}" data-r="declaration"><p>We hereby declare that the stocks and book debts stated above are the absolute property of the company, are free from any charge other than that of the bank, are fully insured, and that the particulars furnished are true and correct to the best of our knowledge.</p>
        <p>We further declare that no receivable above is due from an associate or group concern except as disclosed.</p></div><p class="pnote">Place: ${esc(b.zone)} · Date: ${fmtD(c.receivedAt - 2 * DAY)}</p>`; break;
    default:
      body = p.span ? `<p class="pnote"><b>Invoice listing — pages ${p.span[0]}–${p.span[1]} (${p.span[1] - p.span[0] + 1} pages)</b></p>` + Array.from({ length: 18 }, (_, i) => `<div class="pl dim"><span>INV-${7000 + i * 13} · ${fmtD(STMT_DATE - (i * 7 % 120) * DAY)}</span><span>${num(L(1 + (i * 37 % 19)))}</span></div>`).join('')
        : `<div class="psub"><b>Stock locations</b>${['Plant 1 – main stores', 'Plant 2 – FG warehouse', 'Third-party warehouse', 'Job-work vendors'].map((x, i) => `<div class="pl"><span>${x}</span><span>${[48, 31, 14, 7][i]}%</span></div>`).join('')}</div><p class="pnote">Insurance: Fire & SFSP policy, sum insured adequate. Hypothecation board displayed.</p>`;
  }
  const sig = p.sigReq ? `<div class="psig pr${h('signature')}" data-r="signature">${p.signed ? `<svg viewBox="0 0 120 40" class="sigsvg"><path d="M5 30c10-18 18-22 22-12s-4 16 4 6 10-20 16-8 2 14 10 4 12-14 18-6 8 10 16 2 12-8 20-4"/></svg>` : '<div class="nosig">&nbsp;</div>'}<span>Authorised signatory</span></div>` : '<div class="psig small"><span>Initialled</span></div>';
  const stamp = p.stampReq && p.stamped ? `<div class="pstamp pr${h('stamp')}" data-r="stamp"><span>${esc(b.name.split(' ').slice(0, 2).join(' ').toUpperCase())}</span><span>${esc(b.zone.toUpperCase())}</span></div>` : p.stampReq ? `<div class="pstamp none pr${h('stamp')}" data-r="stamp"></div>` : '';
  return `<div class="paper ${c.scanned ? 'scan' : ''}" style="--skew:${p.skew || 0}deg">
    <div class="plh pr${h('letterhead')}" data-r="letterhead"><b>${esc(b.name)}</b><span>Regd. office: ${esc(b.zone)} · CIN U${29000 + parseInt(b.id.slice(1)) * 7}MH2004PTC${140000 + parseInt(b.id.slice(1)) * 311}</span></div>
    <div class="ptitle pr${h('title')}" data-r="title">${p.type === 'Stock Summary' ? 'Statement of stock and book debts as on 31-Aug-2026' : esc(p.type)}<span>A/c ${b.acct}</span></div>
    ${body}<div class="pfoot">${sig}${stamp}<span class="pno pr${h('pageno')}" data-r="pageno">Page ${p.span ? p.span[0] + '–' + p.span[1] : p.n}</span></div></div>`;
}

/* ---------- Unified statement ---------- */
function tUnified(c){
  const sub = ST.route.sub || 'summary', k = CRE.calculateDP(c), hst = histOf(c);
  const subs = [['summary', 'Summary'], ['stock', 'Stock'], ['debtors', 'Debtors'], ['creditors', 'Creditors'], ['bank', 'Bank limits'], ['decl', 'Declarations'], ['supp', 'Supporting schedules']];
  let b = '';
  if (sub === 'summary') b = `<div class="card">${kv([['Borrower', esc(c.bor.name)], ['Customer ID', c.bor.cust], ['Statement month', c.month], ['Facility', c.cam.facility + ' · ' + c.bor.acct], ['Sanctioned limit', cr(c.sanction)], ['Current outstanding', cr(c.cbsOutstanding)], ['Previous DP (Jul 26)', cr(hst[10].dp)], ['Current proposed DP', cr(k.recommended) + (k.capped ? ' (capped at sanction)' : '')]], 'kv4')}
    <p class="fine muted" style="margin-top:14px">Every borrower format is normalised into this structure. Customer-reported figures are kept alongside system-recalculated values.</p></div>`;
  if (sub === 'stock'){
    const alloc = k.eligibleStock ? k.netStock / k.eligibleStock : 0; let acc = 0; const eligRows = k.rows.filter(r => r.elig);
    b = `<div class="card flush"><div class="tscroll"><table class="tbl"><thead><tr><th>Category</th><th class="r">Customer reported</th><th class="r">System recalculated</th><th>CAM eligible?</th><th class="r">Eligibility</th><th class="r">Eligible amount</th><th class="r">Margin</th><th class="r">DP contribution</th></tr></thead><tbody>
    ${k.rows.map(r => { let dpc = 0; if (r.elig){ const isLast = eligRows[eligRows.length - 1] === r; dpc = isLast ? k.stockDP - acc : Math.round(r.recalc * alloc * (100 - k.stockMarginPct) / 100); acc += dpc; }
      return `<tr><td>${r.cat}</td><td class="r num">${inr(r.rep)}</td><td class="r num ${r.rep !== r.recalc ? 'neg' : ''}">${inr(r.recalc)}${r.rep !== r.recalc ? ' ' + whyBtn('arith:' + c.id) : ''}</td><td>${r.elig ? badge('PASS').replace('PASS', 'Eligible') : `<span class="badge b-red">Ineligible</span> ${whyBtn('git:' + c.id)}`}</td><td class="r num">${r.elig ? '100%' : '0%'}</td><td class="r num">${inr(r.eligAmt)}</td><td class="r num">${r.elig ? k.stockMarginPct + '%' : '—'}</td><td class="r num">${r.elig ? inr(dpc) : '—'}</td></tr>`; }).join('')}
    <tr class="tot"><td>Total</td><td class="r num">${inr(sum(k.rows.map(r => r.rep)))}</td><td class="r num">${inr(k.grossStock)}</td><td></td><td></td><td class="r num">${inr(k.eligibleStock)}</td><td></td><td class="r num">${inr(k.stockDP)}</td></tr></tbody></table></div>
    <p class="fine muted pad">Creditor deduction of ${inr(k.creditors)} is allocated pro-rata across eligible categories before margin.</p></div>`;
  }
  if (sub === 'debtors'){
    const bk = {}; ['0–30', '31–60', '61–90', '91–120', '>120'].forEach(x => bk[x] = 0); k.debts.forEach(d => bk[d.bucket] += d.amt);
    b = `<div class="buckets">${Object.entries(bk).map(([x, v]) => `<div class="${x === '91–120' || x === '>120' ? 'bad' : ''}"><span>${x} days</span><b class="num">${lk(v)}</b><em>${pct(v / k.grossRec * 100, 0)}</em></div>`).join('')}</div>
    <div class="card flush"><div class="card-h"><h3>Receivable schedule</h3><span class="muted fine">CAM rule: only receivables up to ${c.cam.recAge} days are eligible (${CLAUSE.age})</span></div><div class="tscroll"><table class="tbl"><thead><tr><th>Debtor</th><th>Invoice</th><th>Invoice date</th><th>Due date</th><th class="r">Outstanding</th><th class="r">Ageing</th><th>Eligible?</th><th>Reason</th><th class="r">Eligible amount</th><th>Source</th></tr></thead><tbody>
    ${k.debts.map(d => `<tr class="${d.elig ? '' : 'inel'}"><td>${esc(d.name)}${d.related ? ' <span class="tag">Related party</span>' : ''}</td><td>${d.inv}</td><td>${fmtD(STMT_DATE - d.age * DAY)}</td><td>${fmtD(STMT_DATE - d.age * DAY + 45 * DAY)}</td><td class="r num">${inr(d.amt)}</td><td class="r num">${d.effAge}${d.acceptedAge != null ? ` <s class="muted">${d.age}</s>` : ''}</td><td>${d.elig ? '<span class="badge b-green">Yes</span>' : '<span class="badge b-red">No</span>'}</td><td class="fine">${esc(d.reason)} ${!d.elig ? whyBtn((d.related ? 'related:' : 'aged:') + c.id) : ''}</td><td class="r num">${inr(d.eligAmt)}</td><td><a href="#" onclick="A.src(${c.fields.find(f => f.key === 'debtorTotal').page - (c.pages.some(p => p.type === 'Debtor Ageing Schedule') ? 1 : 0)},'table');return false">p.${c.fields.find(f => f.key === 'debtorTotal').page - (c.pages.some(p => p.type === 'Debtor Ageing Schedule') ? 1 : 0)}</a></td></tr>`).join('')}
    <tr class="tot"><td colspan="4">Total</td><td class="r num">${inr(k.grossRec)}</td><td></td><td></td><td></td><td class="r num">${inr(k.eligibleRec)}</td><td></td></tr></tbody></table></div></div>`;
  }
  if (sub === 'creditors') b = `<div class="card flush"><div class="card-h"><h3>Creditors</h3><span class="muted fine">CAM: ${c.cam.deductCreditors ? 'deduct unpaid stock creditors' : 'no deduction'} (${CLAUSE.cred})</span></div><div class="tscroll"><table class="tbl"><thead><tr><th>Creditor</th><th class="r">Amount</th><th>Unpaid stock related?</th><th class="r">Eligible deduction</th><th>Source</th><th>Status</th></tr></thead><tbody>
    ${k.creds.map(x => `<tr><td>${esc(x.name)}</td><td class="r num">${inr(x.amt)}</td><td>${x.stock ? 'Yes' : 'No'}</td><td class="r num">${inr(x.ded)}</td><td><a href="#" onclick="A.src(${c.fields.find(f => f.key === 'credTotal').page},'table');return false">p.${c.fields.find(f => f.key === 'credTotal').page}</a></td><td>${x.stock && !x.custDed ? '<span class="badge b-red">Not deducted by customer</span>' : `<span class="muted">${x.status}</span>`}</td></tr>`).join('')}
    <tr class="tot"><td>Total</td><td class="r num">${inr(sum(k.creds.map(x => x.amt)))}</td><td></td><td class="r num">${inr(k.creditors)}</td><td></td><td></td></tr></tbody></table></div></div>`;
  if (sub === 'bank'){ const multi = c.bId === 'B011';
    b = `<div class="card flush"><div class="tscroll"><table class="tbl"><thead><tr><th>Bank</th><th>Facility</th><th class="r">Sanctioned</th><th class="r">Outstanding</th><th class="r">Available limit</th><th class="r">DP</th></tr></thead><tbody>
      <tr><td>Our bank</td><td>${c.cam.facility}</td><td class="r num">${cr(c.sanction)}</td><td class="r num">${cr(c.cbsOutstanding)}</td><td class="r num">${cr(c.operative - c.cbsOutstanding)}</td><td class="r num">${cr(k.recommended)}</td></tr>
      ${multi ? `<tr><td>Punjab National Bank</td><td>Cash Credit</td><td class="r num">₹6.00 Cr</td><td class="r num">₹5.40 Cr</td><td class="r num">₹0.60 Cr</td><td class="r num muted">Not shared</td></tr>` : ''}
    </tbody></table></div><div class="pad">${kv([['Other banking exposure', multi ? '₹6.00 Cr with PNB' : 'None declared'], ['Arrangement', multi ? 'Multiple banking — no pari-passu DP sharing' : 'Sole banking'], ['Outstanding source', 'Core banking (as of 21-Sep-2026 EOD)']])}</div></div>`; }
  if (sub === 'decl'){ const dec = DocumentIntelligenceService.detectDeclaration(c), sig = DocumentIntelligenceService.detectSignature(c);
    b = `<div class="card">${kv([['Ownership & charge declaration', badge(dec.status)], ['Insurance declaration', badge(dec.status === 'FAIL' ? 'FAIL' : 'PASS')], ['Related-party disclosure', c.debtors.some(d => d.related) ? 'Disclosed: ' + esc(c.debtors.find(d => d.related).name) : 'None disclosed'], ['Signatures on mandatory pages', badge(sig.status) + (sig.missing.length ? ' page ' + sig.missing.join(', ') : '')], ['Signatory', 'Authorised signatory per board resolution on file']])}</div>`; }
  if (sub === 'supp') b = `<div class="card">${c.priorVersion ? `<h3>Revised submission</h3><p>Version 2 received ${fmtDT(c.receivedAt)} supersedes version 1 received ${fmtDT(c.priorVersion.received)}.</p>${kv([['v1 total stock', cr(L(c.priorVersion.stockTotal * 100))], ['v2 total stock', cr(c.stockTotalRep)], ['Change', cr(c.stockTotalRep - L(c.priorVersion.stockTotal * 100))], ['Reason stated', esc(c.priorVersion.reason)]])}<hr>` : ''}
    <h3>Annexures</h3><ul class="plain">${c.pages.filter(p => p.type.startsWith('Annexure')).map(p => `<li><a href="#" onclick="A.src(${p.n},'table');return false">${esc(p.type)}${p.span ? ' (pages ' + p.span[0] + '–' + p.span[1] + ')' : ''}</a> · confidence ${p.conf}%</li>`).join('') || '<li class="muted">None</li>'}</ul></div>`;
  return `<nav class="subtabs">${subs.map(([s, l]) => `<button class="${s === sub ? 'on' : ''}" onclick="A.sub('${s}')">${l}</button>`).join('')}</nav>${b}`;
}

/* ---------- Arithmetic ---------- */
function tArith(c){
  const ar = CRE.arithmeticChecks(c), tot = ar.find(a => a.id === 'AR-STK-TOT'), k = CRE.calculateDP(c);
  const d = Math.abs(tot.diff), impact = Math.round(d * (100 - c.cam.stockMargin) / 100);
  const causes = ar.filter(a => a.id.startsWith('AR-ROW') && a.status === 'MISMATCH');
  const ruleMap = [['Row totals', 'AR-ROW'], ['Column totals', 'AR-STK-COL'], ['Sub-totals', 'AR-ROW'], ['Grand totals', 'AR-STK-TOT'], ['Cross-page totals', 'AR-ROW'], ['Debtor schedules', 'AR-DEB'], ['Creditor schedules', 'AR-CRD'], ['Summary reconciliation', 'AR-STK-TOT']];
  const stOf = pre => { const rel = ar.filter(a => a.id.startsWith(pre)); if (!rel.length) return 'PASS'; return rel.some(a => a.status === 'MISMATCH') ? 'MISMATCH' : rel.some(a => a.status === 'PENDING') ? 'PENDING' : 'PASS'; };
  return `<div class="grid-ar">
    <div class="card ar-head"><h3>Stock total</h3><div class="ar-figs"><div><span>Customer reported</span><b class="num">${tot.pending ? '—' : inr(tot.reported)}</b></div><div><span>System recalculated</span><b class="num">${inr(tot.system)}</b></div><div><span>Difference</span><b class="num ${d ? 'neg' : ''}">${tot.pending ? '—' : inr(d)}</b></div><div><span>Status</span>${badge(tot.status)}</div></div>
      ${tot.status === 'MISMATCH' ? `<p class="fine">${causes.length ? 'Caused by: ' + causes.map(x => esc(x.desc.split(':')[0]) + ' carried at ' + inr(x.reported) + ' against a schedule total of ' + inr(x.system)).join('; ') + '.' : 'Every line item agrees with its schedule; the difference arises in the footing of the column total on page 1.'}</p>` : tot.pending ? '<p class="fine">Waiting for the stock total to be validated in Document intelligence.</p>' : ''}</div>
    <div class="card ar-imp"><h3>Financial impact on DP</h3>${kv([['Arithmetic error', inr(d)], ['Stock margin', c.cam.stockMargin + '%'], ['Potential DP impact', `<b class="num ${d ? 'neg' : ''}">${inr(impact)}</b>`]])}<p class="fine muted">DP is always computed from system-recalculated line items, so an over-footed total cannot inflate drawing power.</p></div>
  </div>
  <div class="card flush"><div class="card-h"><h3>Validation checks</h3><span class="fine muted">Tolerance ${inr(ST.cfg.arithTol)} (rule VAL-ARI-001) · deterministic, no confidence score</span></div><div class="tscroll"><table class="tbl"><thead><tr><th>Check</th><th>Rule</th><th>What is compared</th><th class="r">Reported</th><th class="r">Recalculated</th><th class="r">Difference</th><th>Status</th><th>Source</th></tr></thead><tbody>
  ${ar.map(a => `<tr class="${a.status === 'MISMATCH' ? 'inel' : ''}"><td>${a.id}</td><td>${a.rule}</td><td>${esc(a.desc)}${a.lines ? `<div class="lines">${a.lines.map(l => `<span>${esc(l.name)} <b class="num">${inr(l.amt)}</b></span>`).join('')}</div>` : ''}</td><td class="r num">${a.pending ? '—' : inr(a.reported)}</td><td class="r num">${inr(a.system)}</td><td class="r num">${a.pending ? '—' : inr(a.diff)}</td><td>${badge(a.status)}</td><td><a href="#" onclick="A.src(${a.page},'${a.page === 1 ? 'total' : 'table'}');return false">p.${a.page}</a></td></tr>`).join('')}
  </tbody></table></div></div>
  ${c.stock.every(r => !r.sub) && tot.status === 'MISMATCH' ? `<div class="card flush"><div class="card-h"><h3>Source rows — Stock Summary, page 1</h3></div><table class="tbl"><thead><tr><th>Row</th><th class="r">Customer reported</th><th class="r">System</th></tr></thead><tbody>${c.stock.map(r => `<tr><td>${r.cat}</td><td class="r num">${inr(r.rep)}</td><td class="r num">${inr(r.rep)}</td></tr>`).join('')}<tr class="tot"><td>Σ rows</td><td class="r num">${inr(tot.reported)} <span class="muted">(as footed)</span></td><td class="r num">${inr(tot.system)}</td></tr></tbody></table></div>` : ''}
  <div class="card"><h3>Arithmetic rule coverage</h3><div class="cover">${ruleMap.map(([l, pre]) => `<div><span>${l}</span>${badge(stOf(pre))}</div>`).join('')}</div></div>`;
}

/* ---------- CAM terms ---------- */
function tCam(c, compact = false){
  const m = c.cam;
  const terms = [['Facility', m.facility], ['Sanctioned limit', cr(c.sanction)], ['Stock margin', m.stockMargin + '%'], ['Receivable margin', m.recMargin + '%'], ['Eligible receivable age', '≤' + m.recAge + ' days'],
    ['Creditors treatment', m.deductCreditors ? 'Deduct unpaid stock creditors' : 'No deduction'], ['Stock eligibility', 'RM / WIP / FG / Packing / Stores & Spares'], ['Goods in transit', m.gitEligible ? 'Eligible' : 'Not eligible'],
    ['Related-party receivables', m.excludeRelated ? 'Not eligible' : 'Eligible'], ['Maximum DP', 'Sanctioned limit']];
  const card = `<div class="card"><div class="card-h"><h3>Facility terms</h3><span class="fine muted">Extracted from CAM & DN by Prism IDP · verified by Credit Admin on ${fmtD(new Date(m.dnDate).getTime() + 2 * DAY)}</span></div>${kv(terms.map(([a, b2]) => [a, esc(b2)]), 'kv2')}</div>`;
  if (compact) return card;
  return `<div class="grid2">${card}<div class="card"><h3>Document control</h3>${kv([['CAM effective date', fmtD(new Date(m.camDate).getTime())], ['DN effective date', fmtD(new Date(m.dnDate).getTime())], ['Latest amendment', m.amendment], ['Version', m.version], ['Approval reference', m.approvalRef]])}
    <h3 style="margin-top:18px">Governing clauses</h3><ul class="clauses">
      <li><b>${CLAUSE.elig}</b> Stock eligible for DP: raw material, WIP, finished goods, packing material and stores & spares held at borrower premises.</li>
      <li><b>${CLAUSE.margin}</b> Margin of ${m.stockMargin}% on net eligible stock and ${m.recMargin}% on eligible receivables.</li>
      <li><b>${CLAUSE.age}</b> Receivables above ${m.recAge} days are not eligible for drawing power. Ageing is reckoned from invoice date, or from buyer acceptance where acceptance is evidenced.</li>
      <li><b>${CLAUSE.related}</b> Receivables from associate or group concerns are excluded.</li>
      <li><b>${CLAUSE.cred}</b> Unpaid creditors for stock are deducted from eligible stock before margin.</li>
      <li><b>${CLAUSE.git}</b> Goods in transit are not eligible.</li>
      <li><b>${CLAUSE.cap}</b> Operative limit shall be the lower of drawing power and the sanctioned limit.</li>
      <li><b>${CLAUSE.submit}</b> Monthly statement within 20 days of month end, signed and stamped, with declaration.</li></ul></div></div>`;
}

/* ---------- CAM vs statement ---------- */
function compareRows(c){
  const k = CRE.calculateDP(c), m = c.cam, rows = [];
  const initialOver = sum(c.debtors.filter(d => !d.related && d.age > m.recAge).map(d => d.amt));
  const rel = sum(c.debtors.filter(d => d.related).map(d => d.amt));
  const git = sum(c.stock.filter(r => r.cat === 'Goods in Transit').map(r => r.rep));
  const reqCred = sum(c.creditors.filter(x => x.stock).map(x => x.amt));
  const keep = (v, p) => Math.round(v * (100 - p) / 100);
  rows.push({ p: 'Receivable age', req: '≤' + m.recAge + ' days', st: initialOver ? 'Includes ' + lk(initialOver) + ' > ' + m.recAge + ' days' : 'All within ' + m.recAge + ' days', res: initialOver ? 'FAIL' : 'PASS', imp: initialOver ? lk(k.overaged) + ' excluded' : '—', why: initialOver ? 'aged:' + c.id : '' });
  rows.push({ p: 'Related-party receivables', req: 'Not eligible', st: rel ? lk(rel) + ' included' : 'None', res: rel ? 'FAIL' : 'PASS', imp: rel ? lk(rel) + ' excluded' : '—', why: rel ? 'related:' + c.id : '' });
  rows.push({ p: 'Stock margin', req: m.stockMargin + '%', st: c.custSM + '%', res: c.custSM === m.stockMargin ? 'PASS' : 'FAIL', imp: c.custSM === m.stockMargin ? '—' : lk(Math.round(k.netStock * (m.stockMargin - c.custSM) / 100)) + ' additional margin' });
  rows.push({ p: 'Receivable margin', req: m.recMargin + '%', st: c.custRM + '%', res: c.custRM === m.recMargin ? 'PASS' : 'FAIL', imp: '—' });
  rows.push({ p: 'Creditors', req: 'Deduct unpaid stock creditors', st: c.custDed < reqCred ? lk(reqCred - c.custDed) + ' creditors not deducted' : 'All deducted (' + cr(c.custDed) + ')', res: c.custDed < reqCred ? 'FAIL' : 'PASS', imp: c.custDed < reqCred ? lk(reqCred - c.custDed) + ' deduction' : '—', why: c.custDed < reqCred ? 'cred:' + c.id : '' });
  rows.push({ p: 'Goods in transit', req: m.gitEligible ? 'Eligible' : 'Not eligible', st: git ? lk(git) + ' included' : 'None', res: git && !m.gitEligible ? 'FAIL' : 'PASS', imp: git && !m.gitEligible ? lk(git) + ' excluded' : '—', why: git ? 'git:' + c.id : '' });
  rows.push({ p: 'Sanctioned limit', req: cr(c.sanction), st: cr(fieldVal(c, 'sanction')), res: fieldVal(c, 'sanction') === c.sanction ? 'PASS' : 'FAIL', imp: '—' });
  const os = fieldVal(c, 'outstanding'), osPend = isPending(c, 'outstanding');
  rows.push({ p: 'Outstanding vs core banking', req: cr(c.cbsOutstanding) + ' (CBS)', st: osPend ? 'Pending validation' : cr(os), res: osPend ? 'REVIEW' : Math.abs(os - c.cbsOutstanding) <= ST.cfg.arithTol ? 'PASS' : 'FAIL', imp: '—' });
  const sdp = Math.round((fieldVal(c, 'stockTotal') - c.custDed) * (100 - c.custSM) / 100) + Math.round(fieldVal(c, 'debtorTotal') * (100 - c.custRM) / 100);
  rows.push({ p: 'Drawing power', req: 'Per CAM formula: ' + cr(k.calculatedDP), st: 'Borrower claims ' + cr(sdp), res: Math.abs(sdp - k.calculatedDP) <= ST.cfg.arithTol ? 'PASS' : 'FAIL', imp: sdp !== k.calculatedDP ? cr(sdp - k.calculatedDP) + ' overstated' : '—', why: 'limit:' + c.id });
  rows.push({ p: 'Submission timeliness', req: 'Within 20 days of month end', st: 'Received ' + fmtD(c.receivedAt), res: c.receivedAt <= c.dueDate ? 'PASS' : 'FAIL', imp: '—' });
  return rows;
}
function tCompare(c){
  const rows = compareRows(c);
  return `<div class="card flush"><div class="card-h"><h3>CAM/DN requirement vs stock statement</h3><span class="fine muted">${rows.filter(r => r.res === 'FAIL').length} variance(s) · ${rows.filter(r => r.res === 'PASS').length} compliant</span></div><div class="tscroll"><table class="tbl"><thead><tr><th>Parameter</th><th>CAM/DN requirement</th><th>Stock statement</th><th>Result</th><th>Financial impact</th><th></th></tr></thead><tbody>
  ${rows.map(r => `<tr class="${r.res === 'FAIL' ? 'inel' : ''}"><td><b>${r.p}</b></td><td>${esc(r.req)}</td><td>${esc(r.st)}</td><td>${badge(r.res)}</td><td class="num">${esc(r.imp)}</td><td>${r.why ? whyBtn(r.why) : ''}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}

/* ---------- Exceptions ---------- */
function tExceptions(c){
  if (!c.excs.length) return emptyState('No exceptions', 'This statement passed every document, arithmetic and CAM/DN check.', `<button class="btn primary" onclick="A.tab('dp')">Review drawing power</button>`);
  const sel = c.excs.find(e => e.id === ST.ui.ex) || c.excs.find(e => ['Open', 'Sent to RM', 'RM Responded'].includes(e.status)) || c.excs[0];
  const rmOpen = c.excs.filter(e => e.status === 'Open' && e.rmReq);
  const order = ['Critical', 'High', 'Medium', 'Low'];
  const list = [...c.excs].sort((a, b) => (['Resolved', 'Auto-cleared'].includes(a.status) - ['Resolved', 'Auto-cleared'].includes(b.status)) || order.indexOf(a.sev) - order.indexOf(b.sev));
  return `<div class="ex-ws"><div class="ex-list card flush">
    <div class="card-h"><h3>${c.excs.length} exceptions</h3>${rmOpen.length && can('analyst') ? `<button class="btn sm primary" onclick="A.sendAllRM('${c.id}')">${icon('send', 13)} Send ${rmOpen.length} to RM</button>` : ''}</div>
    ${list.map(e => { const v = exView(c, e); return `<button class="ex-item ${e.id === sel.id ? 'on' : ''}" onclick="A.selEx('${e.id}')">${sevDot(e.sev)}<div><div class="ex-t">${esc(e.title)}</div><div class="fine muted">${e.id} · ${e.cat}${v.impact ? ' · ' + amt(v.impact) : ''}</div></div>${badge(e.status)}</button>`; }).join('')}

}

    <button class="btn ghost" onclick="A.comment('${e.id}')">Add comment</button><button class="btn ghost" onclick="A.src(${e.page},'${regionFor(e)}')">${icon('eye', 14)} View evidence</button></div>`;

    ${tl}${sla}
    <div class="exd-grid">

/* ---------- Drawing power ---------- */
function dpSheetRows(c, k){
  const f = c.fields.find(x => x.key === 'debtorTotal'), stk = CRE.arithmeticChecks(c).find(a => a.id === 'AR-STK-TOT');
  const reaged = c.debtors.filter(d => d.acceptedAge != null);

  return [

    { id: 'is', l: 'Less: ineligible stock', v: k.ineligibleStock, src: 'Stock Summary', pg: '1', rule: 'DP-STK-001/002', adj: k.ineligibleStock ? 'Goods in transit excluded' : 'None', calc: 'Σ ineligible categories', t: 'minus', items: k.rows.filter(r => !r.elig).map(r => [r.cat, r.recalc]) },

    { id: 'sd', l: 'Stock DP', v: k.stockDP, calc: 'Net stock − margin', t: 'sub', hi: true },

    { id: 'oa', l: 'Less: receivables > ' + c.cam.recAge + ' days', v: k.overaged, src: 'Debtor Ageing Schedule', pg: String(f.page - 1 || f.page), rule: 'DP-REC-001', adj: reaged.length ? reaged.map(d => d.inv + ' re-aged to ' + d.acceptedAge + ' days (' + lk(d.amt) + ')').join('; ') : 'None', calc: 'Σ invoices aged > ' + c.cam.recAge, t: 'minus', items: k.debts.filter(d => !d.elig && !d.related).map(d => [d.name + ' · ' + d.inv + ' · ' + d.effAge + 'd', d.amt]) },

    { id: 'rd', l: 'Receivable DP', v: k.recDP, calc: 'Eligible receivables − margin', t: 'sub', hi: true },
    { id: 'td', l: 'Total drawing power', v: k.calculatedDP, calc: 'Stock DP + receivable DP', t: 'grand' },
    { id: 'sl', l: 'Sanctioned limit', v: k.sanction, src: 'CAM / DN', pg: CLAUSE.cap, rule: 'DP-CAP-001', calc: 'As sanctioned', t: 'info' },
    { id: 'ro', l: 'Recommended operative limit', v: k.recommended, calc: 'MIN(' + cr(k.calculatedDP) + ', ' + cr(k.sanction) + ')', rule: 'DP-CAP-001', t: 'grand' },
    { id: 'eo', l: 'Existing operative limit', v: k.existing, src: 'Core banking', t: 'info' },
    { id: 'ch', l: k.change < 0 ? 'Recommended reduction' : 'Recommended increase', v: Math.abs(k.change), calc: 'Recommended − existing', t: 'info' },
